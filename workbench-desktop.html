/* ---------- avatar upload (with compression) ---------- */
$("#avaCam").innerHTML = icon("camera",18);
function applyAvatar(){
  if(data.__avatar){
    $("#avaImg").src = data.__avatar;
    $("#avaImg").style.display = "block";
    $("#avaCam").style.opacity = "";
  } else {
    $("#avaImg").style.display = "none";
    $("#avaCam").style.opacity = "1";
  }
}
applyAvatar();
$("#ava").onclick = () => $("#avatarInput").click();
$("#avatarInput").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const maxW = 200, maxH = 200;
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxW){ h = h * maxW / w; w = maxW; } }
      else { if(h > maxH){ w = w * maxH / h; h = maxH; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      data.__avatar = canvas.toDataURL("image/jpeg", 0.8);
      applyAvatar();
      try { store.save(); toast("头像已更新","success"); }
      catch(err){ toast("保存失败，图片过大","danger"); }
    };
    img.onerror = () => toast("图片加载失败","danger");
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
  e.target.value = "";
};

  overlay.querySelector("#auth-cancel").onclick = close;

  if(supabaseUser){
    overlay.querySelector("#auth-logout").style.display = '';
    overlay.querySelector("#auth-email").value = supabaseUser.email || '';
    overlay.querySelector("#auth-email").disabled = true;
    overlay.querySelector("#auth-pwd").disabled = true;
    overlay.querySelector("#auth-submit").style.display = 'none';
  }

  const tabs = overlay.querySelector("#auth-tabs");
  let mode = tab;
  tabs.querySelectorAll(".tab").forEach(t => t.onclick = () => {
    tabs.querySelectorAll(".tab").forEach(x => x.classList.remove("on")); t.classList.add("on");
    mode = t.dataset.t;
    overlay.querySelector("#auth-submit").textContent = mode === 'register' ? '注册' : '登录';
  });

  overlay.querySelector("#auth-logout").onclick = async () => {
    await supabase.auth.signOut();
    toast("已退出登录","");
    close();
  };

  overlay.querySelector("#auth-submit").onclick = async function handler(){
    if(!supabase){ toast("云服务未连接，请检查网络后刷新重试","danger"); return; }
    const email = overlay.querySelector("#auth-email").value.trim();
    const pwd = overlay.querySelector("#auth-pwd").value;
    if(!email || !pwd){ toast("请填写邮箱和密码","danger"); return; }
    if(pwd.length < 6){ toast("密码至少 6 位","danger"); return; }
    const btn = overlay.querySelector("#auth-submit");
    btn.disabled = true; btn.textContent = '处理中…'; btn.style.opacity = '.6';
    try {
      let result;
      if(mode === 'register'){
        result = await supabase.auth.signUp({ email, password: pwd });
        if(result.error) throw result.error;
        if(result.data.user && !result.data.session){
          toast("注册成功，请查收验证邮件后登录","success"); close(); return;
        }
      } else {
        result = await supabase.auth.signInWithPassword({ email, password: pwd });
        if(result.error) throw result.error;
      }
      if(result.data.session){
        toast("登录成功","success"); close();
      }
    } catch(e){
      const msg = (e.message || e.msg || "操作失败").toLowerCase();
      if(msg.includes('user already registered') || msg.includes('already been registered') || msg.includes('already exists')) toast("该邮箱已注册，请直接登录","danger");
      else if(msg.includes('invalid login') || msg.includes('invalid credentials')) toast("邮箱或密码错误","danger");
      else toast(e.message || e.msg || "操作失败","danger");
      btn.disabled = false; btn.textContent = mode==='register'?'注册':'登录'; btn.style.opacity = '';
    }
  };
}

function renderAuthState(){
  const bar = $('#authBar');
  const btn = $('#btn-login');
  if(supabaseUser){
    if(bar){ bar.style.display = 'flex'; bar.onclick = () => openAuthModal('login'); }
    if(btn){ btn.style.display = 'none'; }
    const av = $('#authAvatar');
    const ae = $('#authEmail');
    if(av){ av.textContent = (supabaseUser.email||'?')[0].toUpperCase(); }
    if(ae){ ae.textContent = supabaseUser.email || ''; }
  } else {
    if(bar){ bar.style.display = 'none'; }
    if(btn){ btn.style.display = ''; btn.onclick = () => openAuthModal('login'); }
  }
}

async function startAuth(){
  try {
  supabase.auth.onAuthStateChange(async (event, session) => {
    supabaseSession = session;
    supabaseUser = session ? session.user : null;
    renderAuthState();

    if(supabaseUser){
      const cloud = await syncLoad();
      if(cloud && typeof cloud === 'object'){
        data = cloud;
        CONFIG.modules.forEach(m => { if(!data[m.key]) data[m.key] = structuredClone(m.seed||[]); });
        store.save();
        applyAvatar();
      } else {
        await syncSave();
      }
      subscribeRealtime();
      render();
    } else {
      if(realtimeChannel){ supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
    }
  });

  const { data: { session } } = await supabase.auth.getSession();
  if(session){
    supabaseSession = session;
    supabaseUser = session.user;
    renderAuthState();
    const cloud = await syncLoad();
    if(cloud && typeof cloud === 'object'){
      data = cloud;
      CONFIG.modules.forEach(m => { if(!data[m.key]) data[m.key] = structuredClone(m.seed||[]); });
      store.save();
      applyAvatar();
    } else {
      await syncSave();
    }
    subscribeRealtime();
  } else {
    renderAuthState();
  }
  } catch(e){ renderAuthState(); console.warn('Auth init failed:', e.message || e); }
}

startAuth();
buildNav();
render();
</script>
</body>
</html>
