  .cal-foot { margin-top:10px; font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }

  .cal-toast { position:fixed; left:50%; bottom:calc(var(--nav-h) + 16px); transform:translateX(-50%) translateY(16px);
    background:var(--text); color:var(--surface-card); font-size:13px; font-weight:600; padding:11px 16px; border-radius:999px;

  /* 打卡模块日历（checkin 专用） */

  .cal-cell { aspect-ratio:1; border-radius:var(--radius-control); display:grid; place-items:center; font-size:12px; font-weight:600;
    color:var(--text-secondary); background:var(--surface-nested); border:1px solid var(--border); cursor:pointer; transition:all .15s; font-family:var(--font); position:relative; }
  .cal-cell.blank { background:transparent; border:none; cursor:default; }

  .cal-cell .cal-num { position:absolute; top:2px; left:4px; font-size:11px; font-weight:600; line-height:1; }

  /* 记账日历 */
  .mc-panel { margin-top:16px; }

  .mc-day { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    border-radius:var(--radius-control); font-size:12px; font-weight:600; cursor:default;
    color:var(--text-secondary); background:var(--surface-nested); border:1px solid transparent; }
  .mc-day.blank { background:transparent; border:none; }
  .mc-day.today { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .mc-day.exp { background:rgba(255,92,92,.22); color:var(--danger); }
  .mc-day.inc { background:rgba(77,217,255,.18); color:var(--accent); }
  .mc-day.net-exp { background:rgba(255,92,92,.28); color:var(--danger); }
  .mc-day.net-inc { background:rgba(77,217,255,.24); color:var(--accent); }
  .mc-day i { font-size:9px; font-style:normal; font-weight:500; display:block; line-height:1; }
  .mc-stats { display:flex; gap:12px; margin-top:10px; font-size:12px; color:var(--text-secondary); }
  .mc-stats span { flex:1; text-align:center; }
  .mc-stats b { display:block; font-size:14px; margin-top:2px; font-weight:700; }

  /* 日程事件样式 */
  .cal-events { display:flex; flex-direction:column; gap:8px; }
  .cal-event { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-tile);
    background:var(--surface-card); border:1px solid var(--border); cursor:pointer; transition: all .15s; }
  .cal-event:active { background:var(--surface-nested); }
  .ev-bar { width:4px; height:28px; border-radius:2px; flex:0 0 auto; }
  .ev-info { flex:1; min-width:0; }
  .ev-info .ev-title { font-size:14px; font-weight:600; color:var(--text); }
  .ev-info .ev-time { font-size:12px; color:var(--text-secondary); margin-top:2px; }
  .ev-del { display:inline-flex; align-items:center; gap:4px; padding:6px 10px; border:none; border-radius:var(--radius-tile);
    background:var(--module-2); color:#e0ccff; font-size:12px; font-weight:600; cursor:pointer;
    font-family:var(--font); transition:all .15s; flex:0 0 auto; }
  .ev-del:active { background:#9f4fff; }
  .cal-empty-day { text-align:center; color:var(--text-tertiary); padding:16px 0; font-size:13px; }

  .hidden { display: none !important; }

  /* ---------- toast ---------- */
  .toast-wrap { position: fixed; bottom: calc(var(--nav-h) + 20px); left: 50%; transform: translateX(-50%); z-index: 9999; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .toast { background: var(--surface-card); border: 1px solid var(--border-input); border-radius: var(--radius-tile);
    padding: 10px 18px; font-size: 13px; font-weight: 600; color: var(--text); box-shadow: var(--shadow-overlay);
    display: flex; align-items: center; gap: 8px; animation: toastIn .25s ease, toastOut .25s ease 1.6s forwards;
    backdrop-filter: blur(8px); }
  .toast svg { color: var(--accent); flex: 0 0 auto; }
  .toast.danger svg { color: var(--danger); }
  .toast.success svg { color: var(--module-4); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(8px) scale(.97); } }
</style>

<script>
/* ============================================================
   轻量 Supabase 客户端（纯 fetch，无需外部 CDN）
   ============================================================ */
const SUPABASE_URL = 'https://xgzcfukjhhpzzzdquwlh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wKxBAj2r5wGj3GoSce-ZIw_9RhpJeMk';

// 构建最小化 supabase 兼容对象，直接调用 REST API
const supabase = {
  _accessToken: null,
  _refreshToken: null,
  _user: null,
  _listeners: [],

  _headers(){
    const h = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };
    if(this._accessToken) h['Authorization'] = 'Bearer ' + this._accessToken;
    return h;
  },

  _setSession(session){
    this._accessToken = session ? session.access_token : null;
    this._refreshToken = session ? session.refresh_token : null;
    this._user = session ? session.user : null;
    if(session){
      localStorage.setItem('_wb_session', JSON.stringify({
        access_token: session.access_token,
        refresh_token: session.refresh_token,
        user: session.user
      }));
    } else {
      localStorage.removeItem('_wb_session');
    }
  },

  _notifyListeners(event){
    this._listeners.forEach(fn => {
      try { fn(event, this._accessToken ? { access_token: this._accessToken, refresh_token: this._refreshToken, user: this._user } : null); }
      catch(e){}
    });
  },

  auth: {
    _client: null,

    onAuthStateChange(callback){
      supabase._client = supabase;
      supabase._listeners.push(callback);
    },

    async signUp({ email, password }){
      const resp = await fetch(SUPABASE_URL + '/auth/v1/signup', {
        method: 'POST', headers: supabase._headers(),
        body: JSON.stringify({ email, password })
      });
      const data = await resp.json();
      if(!resp.ok) return { data: { user: null, session: null }, error: { message: data.msg || data.message || '注册失败' } };
      if(data.session){
        supabase._setSession(data.session);
        supabase._notifyListeners('SIGNED_IN');
        return { data: { user: data.user, session: data.session }, error: null };
      }
      return { data: { user: data.user, session: null }, error: null };
    },

    async signInWithPassword({ email, password }){
      const resp = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
        method: 'POST', headers: supabase._headers(),
        body: JSON.stringify({ email, password })
      });
      const data = await resp.json();
      if(!resp.ok) return { data: { user: null, session: null }, error: { message: data.msg || data.error_description || '登录失败' } };
      supabase._setSession(data);
      supabase._notifyListeners('SIGNED_IN');
      return { data: { user: data.user, session: data }, error: null };
    },

    async signOut(){
      if(supabase._accessToken){
        await fetch(SUPABASE_URL + '/auth/v1/logout', {
          method: 'POST', headers: supabase._headers()
        }).catch(()=>{});
      }
      supabase._setSession(null);
      supabase._notifyListeners('SIGNED_OUT');
      return { error: null };
    },

    async getSession(){
      // 尝试从 localStorage 恢复
      if(!supabase._accessToken){
        try {
          const saved = JSON.parse(localStorage.getItem('_wb_session'));
          if(saved && saved.access_token){
            supabase._accessToken = saved.access_token;
            supabase._refreshToken = saved.refresh_token;
            supabase._user = saved.user;
            // 验证 token 有效
            const resp = await fetch(SUPABASE_URL + '/auth/v1/user', { headers: supabase._headers() });
            if(!resp.ok){
              // token 过期，尝试刷新
              const refResp = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
                method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ refresh_token: saved.refresh_token })
              });
              if(refResp.ok){
                const refData = await refResp.json();
                supabase._setSession(refData);
                return { data: { session: refData } };
              }
              supabase._setSession(null);
              return { data: { session: null } };
            }
            return { data: { session: { access_token: saved.access_token, refresh_token: saved.refresh_token, user: saved.user } } };
          }
        } catch(e){ supabase._setSession(null); }
      }
      if(supabase._accessToken){
        return { data: { session: { access_token: supabase._accessToken, refresh_token: supabase._refreshToken, user: supabase._user } } };
      }
      return { data: { session: null } };
    }
  },

  from(table){
    return {
      select(cols){
        return {
          eq(field, value){
            return {
              async limit(n){
                const resp = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=${cols}&${field}=eq.${encodeURIComponent(value)}&limit=${n}`, {
                  headers: supabase._headers()
                });
                if(!resp.ok) return { data: null, error: { message: '查询失败' } };
                return { data: await resp.json(), error: null };
              }
            };
          }
        };
      },
      async upsert(row){
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
          method: 'POST',
          headers: Object.assign(supabase._headers(), { 'Prefer': 'resolution=merge-duplicates' }),
          body: JSON.stringify(row)
        });
        if(!resp.ok) return { error: { message: '保存失败' } };
        return { error: null };
      }
    };
  },

  channel(name){
    return {
      on(event, filter, callback){
        // 本地存储轮询替代实时订阅（每 5 秒检查）
        return this;
      },
      subscribe(){
        return { unsubscribe: ()=>{} };
      }
    };
  },

  removeChannel(ch){ }
};

function subscribeRealtime(){
  if(!supabase || !supabaseUser) return;
  if(realtimeChannel) supabase.removeChannel(realtimeChannel);
  realtimeChannel = supabase
    .channel('data-changes')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'user_data', filter: `user_id=eq.${supabaseUser.id}` },
      (payload) => {
        if(payload.new && payload.new.data){
          data = payload.new.data;

    )

let lastSyncAt = 0;   // 上次已知的云端数据更新时间（毫秒）

async function syncSave(){
  if(!supabase || !supabaseUser) return;
  const now = new Date().toISOString();
  const row = { user_id: supabaseUser.id, data: data, updated_at: now };
  const { error } = await supabase.from('user_data').upsert(row);
  if(error){ console.warn('保存失败:', error); return false; }
  lastSyncAt = new Date(now).getTime();
  return true;
}

async function syncLoad(){
  if(!supabase || !supabaseUser) return;
  const { data: rows, error } = await supabase.from('user_data').select('data,updated_at').eq('user_id', supabaseUser.id).limit(1);
  if(error){ console.warn('加载失败:', error); return null; }
  if(rows && rows.length>0){
    lastSyncAt = rows[0].updated_at ? new Date(rows[0].updated_at).getTime() : 0;
    return rows[0].data;
  }
  return null;
}

/* 定时轮询云端，实现多设备近似实时同步（每 5 秒比较更新时间） */
let syncPollTimer = null;
function startSyncPolling(){
  if(syncPollTimer || !supabaseUser) return;
  syncPollTimer = setInterval(async ()=>{
    if(!supabaseUser) return;
    try {
      const { data: rows, error } = await supabase.from('user_data').select('data,updated_at').eq('user_id', supabaseUser.id).limit(1);
      if(error || !rows || !rows.length) return;
      const cloudAt = rows[0].updated_at ? new Date(rows[0].updated_at).getTime() : 0;
      if(cloudAt > lastSyncAt){
        const cloudData = rows[0].data;
        if(cloudData && typeof cloudData === 'object'){
          data = cloudData;
          CONFIG.modules.forEach(m => { if(!data[m.key]) data[m.key] = structuredClone(m.seed||[]); });
          lastSyncAt = cloudAt;
          store.save();
          applyAvatar();
          render();
        }
      }
    } catch(e){ /* 网络抖动忽略，下轮再试 */ }
  }, 5000);
}

function todoWeek(d){

  return items.filter(x=>{ const ts=(typeof x.id==="number"&&x.id>1e12)?x.id:0; return ts>0&&ts>=wk; });
}
function cleanExpiredData(d){
  const settings = d.__settings && d.__settings.modules;
  if(!settings) return;
  const now = Date.now();
  const periods = { "1m": 30*864e5, "6m": 180*864e5, "12m": 365*864e5 };
  CONFIG.modules.forEach(m=>{
    const expiry = settings[m.key];
    if(!expiry || expiry === "forever" || !periods[expiry]) return;
    const cutoff = now - periods[expiry];
    const items = d[m.key] || [];
    d[m.key] = items.filter(x=>{
      // use date field or id (timestamp) as reference
      const ref = x.date ? new Date(x.date).getTime() : (x.id || 0);
      return ref > cutoff;
    });
    // clean checkin logs older than cutoff
    if(m.type === "checkin"){
      (d[m.key]||[]).forEach(x=>{
        if(x.log){
          const cleanLog = {};
          Object.entries(x.log).forEach(([k,v])=>{
            if(new Date(k).getTime() > cutoff) cleanLog[k] = v;
          });
          x.log = cleanLog;
        }
      });
    }
  });
}
function toast(msg, type=""){
  let wrap=document.querySelector(".toast-wrap");
  if(!wrap){ wrap=document.createElement("div"); wrap.className="toast-wrap"; document.body.appendChild(wrap); }
  const t=document.createElement("div"); t.className="toast "+type;
  const ic = type==="danger" ? icon("trash",15) : type==="success" ? icon("check",15) : icon("bolt",15);
  t.innerHTML=ic+`<span>${esc(msg)}</span>`;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 2000);
}

/* ---------- calendar helpers ---------- */
const EVENT_TYPES = CONFIG.eventTypes;
const evTypeOf = k => EVENT_TYPES.find(t=>t.key===k) || EVENT_TYPES[0];
function getEvents(){ return data.__events || (data.__events=[]); }
function eventsOnDay(dateStr){
  return getEvents().filter(ev=>{
    const s=ev.start.slice(0,10), e=ev.end.slice(0,10);
    return dateStr>=s && dateStr<=e;
  });
}
function eventsInMonth(year,month){
  const ms=`${year}-${pad2(month+1)}`;
  return getEvents().filter(ev=> ev.start.slice(0,7)===ms || ev.end.slice(0,7)===ms ||
    (ev.start.slice(0,7)<ms && ev.end.slice(0,7)>ms));
}
function buildCalendarGrid(year,month){
  const first=new Date(year,month,1);
  const startDow=(first.getDay()+6)%7;
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[];
  const prevDays=new Date(year,month,0).getDate();
  for(let i=startDow-1;i>=0;i--) cells.push({day:prevDays-i,other:true,date:`${month===0?year-1:year}-${pad2(month===0?12:month)}-${pad2(prevDays-i)}`});
  for(let d=1;d<=daysInMonth;d++) cells.push({day:d,other:false,date:`${year}-${pad2(month+1)}-${pad2(d)}`});
  while(cells.length<42){ const idx=cells.length-(startDow+daysInMonth)+1; const nm=month===11?0:month+1, ny=month===11?year+1:year; cells.push({day:idx,other:true,date:`${ny}-${pad2(nm+1)}-${pad2(idx)}`}); }
  return cells;
}
function dayEventBg(dateStr){
  const evs=eventsOnDay(dateStr);
  if(!evs.length) return "";
  const types=new Set(evs.map(e=>e.type));
  if(types.size>1) return "bg-multi";
  return "bg-"+[...types][0];
}
function dayEventDots(dateStr){
  const evs=eventsOnDay(dateStr);
  if(!evs.length) return "";
  const types=[...new Set(evs.map(e=>e.type))];
  return `<div class="dots">${types.map(t=>`<i style="background:${evTypeOf(t).color}"></i>`).join("")}</div>`;
}
function formatEventTime(ev){
  const sDate=ev.start.slice(0,10), eDate=ev.end.slice(0,10);
  const sTime=ev.start.slice(11,16), eTime=ev.end.slice(11,16);
  if(sDate===eDate){
    if(sTime==="00:00"&&eTime==="23:59") return "全天";
    return `${sTime} - ${eTime}`;
  }
  return `${ev.start.slice(5,16)} → ${ev.end.slice(5,16)}`;
}
function openEventEditor(dateStr, ev){
  const editing=!!ev;
  const d=ev || {id:Date.now(), title:"", type:"work", start:dateStr+"T09:00", end:dateStr+"T10:00"};
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><h3>${editing?'编辑':'新建'}日程</h3><div class="sub">${dateStr}</div>
    <div class="field"><label>事项</label><input id="ev-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>
    <div class="field"><label>类型</label><div class="seg" id="ev-type">${EVENT_TYPES.map(t=>`<div class="opt ${t.key===d.type?'on':''}" data-v="${t.key}">${t.label}</div>`).join("")}</div></div>
    <div class="field"><label>开始</label><input id="ev-start" type="datetime-local" value="${d.start}"/></div>
    <div class="field"><label>结束</label><input id="ev-end" type="datetime-local" value="${d.end}"/></div>
    <div class="modal-actions">${editing?'<button class="link-danger" id="ev-del">删除</button>':''}<div class="spacer"></div>
      <button class="btn ghost" id="ev-cancel">取消</button><button class="btn" id="ev-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#ev-cancel").onclick=close;
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on"); }));
  if(editing) overlay.querySelector("#ev-del").onclick=()=>{ close(); data.__events=getEvents().filter(e=>e.id!==d.id); persist(); toast("日程已删除","success"); };
  overlay.querySelector("#ev-save").onclick=()=>{
    d.title=(overlay.querySelector("#ev-title").value||"").trim()||"未命名";

    d.start=overlay.querySelector("#ev-start").value || dateStr+"T09:00";
    d.end=overlay.querySelector("#ev-end").value || dateStr+"T10:00";
    if(!editing) getEvents().push(d);
    persist(); toast(editing?"日程已更新":"日程已新建","success"); close();
  };
}

/* ---------- donut chart (支出占比) ---------- */
function donutSVG(segs){
  const total=segs.reduce((s,x)=>s+x.amount,0)||1;
  const r=42, c=2*Math.PI*r; let acc=0; const out=[];
  segs.forEach(s=>{
    const len=(s.amount/total)*c;
    out.push(`<circle cx="52" cy="52" r="${r}" fill="none" stroke="${s.color}" stroke-width="14"
      stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(c-acc).toFixed(2)}" transform="rotate(-90 52 52)"/>`);
    acc+=len;
  });
  return `<svg viewBox="0 0 104 104" width="104" height="104">${out.join("")}</svg>`;
}

function wireCalendar(key, it){
  const block=$("#screen").querySelector(".cal-panel"); if(!block) return;
  block.querySelectorAll("[data-cal]").forEach(el=>el.onclick=()=>{
    const now=new Date(); let y=calMonth?calMonth.y:now.getFullYear(), mo=calMonth?calMonth.m:now.getMonth();

  block.querySelectorAll(".cal-cell[data-date]").forEach(el=>el.onclick=()=>{

    const todayIso=isoToday();

let calToastTimer=null;

  clearTimeout(calToastTimer);

      store.save(); syncSave();
      toast("问候语已更新","success");
    });
    gs.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); gs.blur(); } });
  }
  // 月历：单击看日程 / 长按新建
  const wireCalLongPress = (el) => {
    let timer = null;
    const dateStr = el.dataset.date;
    const start = (e) => {
      timer = setTimeout(() => {
        timer = null;
        evCalSelected = dateStr;
        openEventEditor(dateStr, null);
      }, 500);
    };
    const cancel = () => { if(timer){ clearTimeout(timer); timer = null; } };
    const end = () => {
      if(timer){
        clearTimeout(timer); timer = null;
        evCalSelected = dateStr;
        showDayEvents(dateStr);
      }
    };
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', end);
    el.addEventListener('mouseleave', cancel);
    el.addEventListener('touchstart', start, {passive: true});
    el.addEventListener('touchend', end);
    el.addEventListener('touchmove', cancel);
    el.addEventListener('touchcancel', cancel);
  };
  $("#screen").querySelectorAll(".cal-day[data-date]").forEach(wireCalLongPress);
  // 行程月历月份切换
  const hmP=$("#screen").querySelector(".hm-cal-prev");
  const hmN=$("#screen").querySelector(".hm-cal-next");
  if(hmP) hmP.onclick=()=>{ evCalMonth=new Date(evCalMonth.getFullYear(), evCalMonth.getMonth()-1, 1); renderHome(); };
  if(hmN) hmN.onclick=()=>{ evCalMonth=new Date(evCalMonth.getFullYear(), evCalMonth.getMonth()+1, 1); renderHome(); };
}

/* 查看某天的日程弹窗 */
function showDayEvents(dateStr){
  const evs = eventsOnDay(dateStr);
  const overlay = document.createElement("div"); overlay.className = "overlay";
  overlay.style.alignItems = "center";
  const list = evs.length
    ? evs.sort((a,b)=>a.start.localeCompare(b.start)).map(ev=>{
        const t = evTypeOf(ev.type);
        return `<div class="cal-event" data-evid="${ev.id}"><span class="ev-bar" style="background:${t.color}"></span>
          <div class="ev-info"><div class="ev-title">${esc(ev.title)}</div><div class="ev-time">${formatEventTime(ev)}</div></div>
          <button class="ev-del">${icon("paw-off",14)}删除日程</button></div>`;
      }).join("")
    : `<div style="text-align:center;color:var(--text-tertiary);padding:20px 0;font-size:13px">${dateStr} 暂无日程</div>`;
  overlay.innerHTML = `<div class="modal"><div class="grab"></div><h3>${dateStr} 的日程</h3><div class="sub">${evs.length} 项</div>
    ${list}
    <div class="modal-actions"><div class="spacer"></div>
      <button class="btn ghost" id="day-cancel">关闭</button>
      <button class="btn" id="day-add" style="background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;gap:4px">${icon("plus",13,2.5)}新建</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if(e.target === overlay) close(); };
  overlay.querySelector("#day-cancel").onclick = close;
  overlay.querySelector("#day-add").onclick = () => { close(); openEventEditor(dateStr, null); };
  overlay.querySelectorAll(".cal-event").forEach(el=>el.onclick=e=>{
    if(e.target.closest(".ev-del")) return;
    const ev = getEvents().find(x=>x.id==el.dataset.evid);
    if(ev){ close(); openEventEditor(dateStr, ev); }
  });
  overlay.querySelectorAll(".ev-del").forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const evid = el.closest(".cal-event").dataset.evid;
    data.__events = getEvents().filter(x=>x.id!=evid);
    persist(); close(); toast("日程已删除","success");
  });
}

/* ---------- INSIGHT ---------- */
function renderInsight(){
  // auto-update selected date if it's stale
  if(evCalSelected < isoToday()) evCalSelected = isoToday();
  // 模块完成度柱状条
  const DONUT_COLORS=["var(--module-4)","var(--module-3)","var(--module-5)","var(--module-2)","var(--module-1)","var(--danger)","var(--text-tertiary)"];
  const bars = CONFIG.modules.map(m=>{
    const it=data[m.key]||[]; let pct=0, label="";
    if(m.type==="todo"){ const rec=todoWeek(data); const d=rec.filter(x=>x.done).length; pct=rec.length?Math.round(d/rec.length*100):0; label=`${d}/${rec.length}`; }
    else if(m.type==="checkin"){ const t=today(); const d=it.filter(x=>x.log&&x.log[t]).length; pct=it.length?Math.round(d/it.length*100):0; label=`${d}/${it.length}`; }
    else if(m.type==="progress"){ pct=avgProgress(it).value; const todayIso=isoToday();
      const doneN=it.filter(x=>((x.current/x.target)*100||0)>=100).length;
      const activeN=it.filter(x=>((x.current/x.target)*100||0)<100 && (!x.endDate||x.endDate>=todayIso)).length;

    else if(m.type==="finance"){ const e=it.filter(x=>x.type==="expense").reduce((s,x)=>s+ +x.amount,0); const budget=+(data.__budget||0); pct=budget?Math.min(100,Math.round(e/budget*100)):0; label=budget?`¥${e} · ${Math.round(e/budget*100)}%`:`¥${e}`; }
    else { label=`${it.length} 条`; }

  const cats = (modOf("money")&&modOf("money").categories)||[];
  let segs = cats.map(c=>({ cat:c, amount: exps.filter(x=>x.category===c).reduce((s,x)=>s+ +x.amount,0) }))

  const donut = segs.length ? donutSVG(segs) : `<div class="donut-empty">${icon("wallet",22)}<span>暂无</span></div>`;

  // upcoming events (next 5)

  // 长线计划统计

    <div class="panel"><div class="ph">${icon("chart",15)} 模块完成度<span class="avg">均 ${barAvg}%</span></div>

    <div class="panel">
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev">${icon("chevron",16,2)}</button>

        <button class="btn" id="cal-add" style="margin-left:auto;background:var(--accent);color:var(--on-accent);font-size:12px;padding:5px 12px;display:inline-flex;align-items:center;gap:4px">${icon("plus",13,2.5)}新建</button>
      </div>
      <div class="cal-dow-row">${dows.map(d=>`<span class="${d==='六'||d==='日'?'wk':''}">${d}</span>`).join("")}</div>

  $("#cal-add").onclick=()=>openEventEditor(evCalSelected,null);

/* ---------- 记账本月历 ---------- */
function renderMoneyCalendar(items){
  const y = moneyCalMonth.getFullYear(), m = moneyCalMonth.getMonth();
  const dim = new Date(y, m+1, 0).getDate();
  const firstDow = (new Date(y, m, 1).getDay()+6)%7;
  const todayStr = isoToday();
  const now = new Date();

  // 只统计当前显示月份的账目，避免把其他月份错位归到本月日期上
  const ym=`${y}-${pad2(m+1)}`;
  items=items.filter(x=>x.date&&x.date.slice(0,7)===ym);

  // 按日汇总
  const dayMap = {};
  items.forEach(x=>{
    if(!x.date) return;
    const d = parseInt(x.date.slice(8,10));
    if(!dayMap[d]) dayMap[d] = { exp:0, inc:0 };
    if(x.type==='expense') dayMap[d].exp += (+x.amount||0);
    else dayMap[d].inc += (+x.amount||0);
  });

  const totalExp = items.filter(x=>x.type==='expense').reduce((s,x)=>s+(+x.amount||0),0);
  const totalInc = items.filter(x=>x.type==='income').reduce((s,x)=>s+(+x.amount||0),0);
  const budget = +(data.__budget||0);
  const remain = budget-totalExp;

  // 空单元格
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += '<div class="mc-day blank"></div>';
  for(let d=1;d<=dim;d++){
    const dd = dayMap[d];
    const isToday = (d===now.getDate()) ? ' today' : '';
    const dateStr = `${y}-${pad2(m+1)}-${pad2(d)}`;
    if(!dd){
      cells += `<div class="mc-day${isToday}" data-date="${dateStr}"><span>${d}</span></div>`;
    } else if(dd.exp > 0 && dd.inc > 0){
      const net = dd.inc - dd.exp;
      const cls = net >= 0 ? 'net-inc' : 'net-exp';
      cells += `<div class="mc-day ${cls}${isToday}" data-date="${dateStr}"><span>${d}</span><i>¥${Math.abs(net)}</i></div>`;
    } else if(dd.exp > 0){
      cells += `<div class="mc-day exp${isToday}" data-date="${dateStr}"><span>${d}</span><i>¥${dd.exp}</i></div>`;
    } else {
      cells += `<div class="mc-day inc${isToday}" data-date="${dateStr}"><span>${d}</span><i>¥${dd.inc}</i></div>`;
    }
  }

  const dows = ['一','二','三','四','五','六','日'];
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  return `<div class="panel mc-panel"><div class="ph">${icon("calendar",15)}<button class="cal-nav mc-nav-prev">${icon("chevron",14,2)}</button><span style="flex:1;text-align:center">${monthNames[m]}</span><button class="cal-nav mc-nav-next" style="transform:rotate(180deg)">${icon("chevron",14,2)}</button><span class="avg">${items.length} 笔</span></div>
    <div class="cal-dow-row">${dows.map(d=>`<span class="${d==='六'||d==='日'?'wk':''}">${d}</span>`).join("")}</div>
    <div class="mc-grid">${cells}</div>
    <div class="mc-stats"><span>月支出 <b style="color:var(--danger)">¥${totalExp}</b></span><span>月收入 <b style="color:var(--accent)">¥${totalInc}</b></span><span>预算余 <b style="color:${budget?(remain>=0?'var(--module-4)':'var(--danger)'):''}">${budget?(remain>=0?'+':'-')+'¥'+Math.abs(remain):'—'}</b></span></div>
  </div>`;
}

/* ---------- MODULE VIEW ---------- */
function renderModule(key){
  const m=modOf(key); const it=data[key]||[];
  const t=today();
  let head="", extra="";
  if(m.type==="finance"){
    const ym=isoToday().slice(0,7), yyyy=isoToday().slice(0,4);
    const mRecs=it.filter(x=>x.date&&x.date.slice(0,7)===ym);

    const budget=+(data.__budget||0);
    const mBal=budget-mExp, mBalCol=budget?(mBal>=0?'var(--module-4)':'var(--danger)'):'';
    const yExp=yRecs.filter(x=>x.type==="expense").reduce((s,x)=>s+ +x.amount,0);
    const yInc=yRecs.filter(x=>x.type==="income").reduce((s,x)=>s+ +x.amount,0);

    head=`<div class="mod-summary">
      <div class="mini js-budget" style="cursor:pointer" title="点击设置预算"><div class="l">月预算</div><div class="v" style="color:var(--module-5)">${budget?`¥${budget}`:'—'}</div></div>
      <div class="mini"><div class="l">月支出</div><div class="v" style="color:var(--danger)">¥${mExp}</div></div>
      <div class="mini"><div class="l">月余额</div><div class="v" style="color:${mBalCol}">${budget?(mBal>=0?'+':'-')+'¥'+Math.abs(mBal):'—'}</div></div></div>
    <div class="mod-summary" style="margin-bottom:0">
      <div class="mini"><div class="l">年度支出</div><div class="v" style="color:var(--danger)">¥${yExp}</div></div>
      <div class="mini"><div class="l">年度收入</div><div class="v" style="color:var(--accent)">¥${yInc}</div></div>
      <div class="mini"><div class="l">年度差额</div><div class="v" style="color:${yNet>=0?'var(--module-4)':'var(--danger)'}">${yNet>=0?'+':'-'}¥${Math.abs(yNet)}</div></div></div>`;
    extra = renderMoneyCalendar(it);
  } else if(m.type==="todo"){
    const rec=todoWeek(data); const done=rec.filter(x=>x.done).length; const pct=rec.length?Math.round(done/rec.length*100):0;
    head=headHero(m, `${done}/${rec.length}`, "近7日已完成", pct);
  } else if(m.type==="checkin"){
    const done=it.filter(x=>x.log&&x.log[t]).length; const pct=it.length?Math.round(done/it.length*100):0;
    head=headHero(m, `${done}/${it.length}`, "今日已打卡", pct);
  } else if(m.type==="progress"){
    const p=avgProgress(it); const todayIso=isoToday();
    const doneN=it.filter(x=>((x.current/x.target)*100||0)>=100).length;
    const activeN=it.filter(x=>((x.current/x.target)*100||0)<100 && (!x.endDate||x.endDate>=todayIso)).length;
    const expiredN=it.filter(x=>((x.current/x.target)*100||0)<100 && x.endDate&&x.endDate<todayIso).length;
    head=headHero(m, `${p.value}%`, `进行${activeN} · 达成${doneN} · 未完${expiredN}`, p.value);
  } else if(m.type==="note"){
    const todayN=it.filter(x=>x.date===t).length;
    head=headHero(m, `${it.length}`, `条记录 · 今日 ${todayN} 条`, null);
  }
  if(m.type==="checkin") extra=renderCalendar(m,it);
  // pagination for checkin: 10 per page
  let pageHtml="";
  if(m.type==="checkin"){
    const pageSize=10;
    const totalPages=Math.ceil(it.length/pageSize);
    const curPage=Math.min((data[`__pg_${key}`]||1), Math.max(1,totalPages));
    data[`__pg_${key}`]=curPage;
    const start=(curPage-1)*pageSize;
    const pageItems=it.slice(start, start+pageSize);
    const body2 = pageItems.length ? pageItems.map(x=>recHTML(m,x)).join("")
      : `<div class="empty"><span class="e">${icon(m.icon,26)}</span><div>还没有记录，点上方「新建」添加第一条吧</div></div>`;
    pageHtml = `<div class="sec-title">记录<span style="margin-left:auto;font-weight:500;color:var(--text-secondary);font-size:12px">${curPage}/${totalPages||1} 页 · ${it.length} 条</span></div>${body2}
      ${totalPages>1?`<div style="display:flex;justify-content:center;gap:10px;margin:14px 0 4px">
        <button class="btn ghost pg-btn" data-pg="prev" ${curPage<=1?'disabled':''} style="flex:0 0 auto;padding:8px 16px">${icon("chevron",14,2)}</button>
        <button class="btn ghost pg-btn" data-pg="next" ${curPage>=totalPages?'disabled':''} style="flex:0 0 auto;padding:8px 16px;transform:rotate(180deg)">${icon("chevron",14,2)}</button>
      </div>`:''}`;
  }
  const body = it.length ? it.map(x=>recHTML(m,x)).join("")
    : `<div class="empty"><span class="e">${icon(m.icon,26)}</span><div>还没有记录，点上方「新建」添加第一条吧</div></div>`;
  $("#screen").innerHTML = `<div class="greet"><div><h1>${m.name}</h1><p>${m.desc}</p></div>
      <button class="add" id="btn-add">${icon("plus",16,2.2)}新建</button></div>
    <div style="margin-top:16px">${head}
      ${m.type==="checkin"?extra:''}
      ${m.type==="checkin"?pageHtml:`<div class="sec-title">记录</div>${body}`}
      ${m.type==="checkin"?'':extra}</div>`;
  wireModule(key);
}

/* per-module hero header: compact strip — icon + big number + label + optional progress bar */
function headHero(m, big, label, pct){
  const inner=`<div class="hero-ic" style="background:${m.tint};color:${m.color}">${icon(m.icon,20)}</div>
    <div style="flex:1;min-width:0"><div class="hero-tx"><span class="hero-v">${big}</span><span class="hero-l">${label}</span></div>
    ${pct!=null?`<div class="hero-bar"><i style="width:${Math.min(100,pct)}%;background:${m.color}"></i></div>`:''}</div>`;
  if(m.cover) return `<div class="hero has-cover"><div class="hero-bg" style="background-image:url('${attr(m.cover)}')"></div><div class="hero-inner">${inner}</div></div>`;
  return `<div class="hero">${inner}</div>`;
}

function recHTML(m,x){
  const pin=`<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶">${icon("star",15)}</button>`;
  const del=`<button class="del js-del" data-id="${x.id}" title="删除">${icon("trash",16)}</button>`;
  const acts=`<div class="acts">${pin}${del}</div>`;
  const chkMark=icon("check",14,2.4);
  const customMeta=(m.fields||[]).filter(f=>x[f.key]).map(f=>`<span class="meta-tag">${esc(x[f.key])}</span>`).join("");
  const customBlock=customMeta?`<div class="meta-line">${customMeta}</div>`:'';
  const layout=x.layout||'default';
  const layoutCls=`rec-layout-default`;

  // default layout
  if(m.type==="todo"){
    const p=(m.priorities||[]).find(p=>p.key===x.priority);
    return `<div class="rec ${layoutCls}">${acts}<div class="top">
      <div class="chk js-chk ${x.done?'on':''}" data-id="${x.id}">${chkMark}</div>
      <div class="body" data-edit="${x.id}"><div class="rname ${x.done?'done':''}">${esc(x.title)}</div>
      <div class="rmeta">${p?`<span class="badge" style="background:${p.color};color:${p.text}"><span class="dot"></span>${p.label}</span>`:''}</div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type==="checkin"){
    const on=!!(x.log&&x.log[today()]); const st=streak(x.log);
    return `<div class="rec ${layoutCls}">${acts}<div class="top">
      <div class="chk js-chk ${on?'on':''}" data-id="${x.id}">${chkMark}</div>
      <div class="body" data-edit="${x.id}"><div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span class="streak">${icon("flame",13)} 连续 ${st} 天</span>${on?'<span class="badge" style="background:var(--accent-muted);color:var(--accent)">今日已打卡</span>':''}</div>${customBlock}</div></div></div>`;
  }
  if(m.type==="progress"){
    const pct=Math.min(100,Math.round((x.current/x.target)*100||0));
    const done=pct>=100;
    const expired=x.endDate&&x.endDate<isoToday()&&!done;
    const statusCls=done?'done':'';
    const statusBadge=done?`<span class="badge" style="background:rgba(92,255,157,.15);color:#5cff9d">已达成</span>`
      :expired?`<span class="badge" style="background:rgba(255,92,92,.12);color:#ff5c5c">已过期</span>`:'';
    const dateRange=(x.startDate||x.endDate)?`<span style="color:var(--text-tertiary);font-size:12px">${x.startDate||'?'} → ${x.endDate||'无限'}</span>`:'';
    return `<div class="rec ${layoutCls}">${acts}<div class="top"><div class="body" data-edit="${x.id}">
      <div class="rname ${statusCls}">${esc(x.title)}</div>
      <div class="rmeta">${statusBadge}<span style="color:var(--text-secondary);font-size:13px">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span>${dateRange}</div>
      <div class="pbar"><i style="width:${pct}%;background:${done?'var(--module-4)':expired?'#ff5c5c':m.color}"></i></div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}
      <button class="rec-paw-btn" data-paw-inc="${x.id}">${icon("paw",16)}<span>进度+1</span></button></div></div></div>`;
  }
  if(m.type==="finance"){
    const inc=x.type==="income";
    return `<div class="rec ${layoutCls}">${acts}<div class="top"><div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title||x.category||'记账')}</div>
      <div class="rmeta"><span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${esc(x.category||'其他')}</span><span style="color:var(--text-secondary);font-size:12px">${x.date||''}</span></div>${customBlock}</div>
      <div class="amt ${inc?'inc':'exp'}" style="margin-left:auto">${inc?'+':'-'}¥${x.amount}</div></div></div>`;
  }
  // note
  return `<div class="rec ${layoutCls}">${acts}<div class="top"><div class="body" data-edit="${x.id}">
    <div class="rname">${esc(x.title||'无标题')}</div>
    <div class="rmeta">${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}<span style="color:var(--text-secondary);font-size:12px">${x.date||''}</span></div>
    ${x.content?`<div class="rnote">${esc(x.content)}</div>`:''}${customBlock}</div></div></div>`;
}

function streak(log){
  if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10); if(log[key]){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

function wireModule(key){
  const m=modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id);
    if(m.type==="todo"){ x.done=!x.done; if(x.done) x.pinned=false; }
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); if(x.log[t]){ delete x.log[t]; } else { x.log[t]=true; x.pinned=false; } }
    persist();
  });
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); if(!tryPin(x)) return; x.pinned=!x.pinned; persist(); });
  $("#screen").querySelectorAll("[data-paw-inc]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.pawInc); if(x){ x.current=(+x.current||0)+1; persist(); } });
  const add=$("#btn-add"); if(add) add.onclick=()=>openEditor(key,null);
  if(m.type==="checkin") wireCalendar(key, data[key]||[]);
  // checkin pagination
  if(m.type==="checkin"){
    $("#screen").querySelectorAll(".pg-btn").forEach(el=>el.onclick=()=>{
      const dir=el.dataset.pg;
      const cur=data[`__pg_${key}`]||1;
      if(dir==="prev"&&cur>1) data[`__pg_${key}`]=cur-1;
      else if(dir==="next") data[`__pg_${key}`]=cur+1;
      render();
    });
  }
  // 记账日历：长按日期新建记账
  if(m.type==="finance"){
    $("#screen").querySelectorAll(".mc-day:not(.blank)").forEach(el=>{
      let timer=null;
      const dateStr=el.dataset.date;
      el.addEventListener("pointerdown",()=>{ timer=setTimeout(()=>{ timer=null; openEditor(key,null,{date:dateStr}); }, 500); });
      el.addEventListener("pointerup",()=>{ if(timer){ clearTimeout(timer); timer=null; } });
      el.addEventListener("pointerleave",()=>{ if(timer){ clearTimeout(timer); timer=null; } });
    });
    // 记账日历月份切换
    const p=$("#screen").querySelector(".mc-nav-prev");
    const n=$("#screen").querySelector(".mc-nav-next");
    if(p) p.onclick=()=>{ moneyCalMonth=new Date(moneyCalMonth.getFullYear(), moneyCalMonth.getMonth()-1, 1); render(); };
    if(n) n.onclick=()=>{ moneyCalMonth=new Date(moneyCalMonth.getFullYear(), moneyCalMonth.getMonth()+1, 1); render(); };
    // 预算设置
    const b=$("#screen").querySelector(".js-budget");
    if(b) b.onclick=()=>openBudgetModal();
  }
}

/* ---------- EDITOR MODAL (per type) ---------- */
function openEditor(key, item, defaults){
  const m=modOf(key); const editing=!!item;
  const d = item || (defaults ? {...newItem(m), ...defaults} : newItem(m));
  let fields="";
  if(m.type==="todo"){
    fields=`<div class="field"><label>任务</label><input id="f-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>
      <div class="field"><label>优先级</label><div class="seg" id="f-prio">${(m.priorities||[]).map(p=>`<div class="opt ${p.key===d.priority?'on':''}" data-v="${p.key}">${p.label}</div>`).join("")}</div></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="checkin"){
    fields=`<div class="field"><label>打卡项</label><input id="f-title" value="${attr(d.title)}" placeholder="例如：喝够 8 杯水"/></div>
      <p class="sub" style="margin:0">保存后可在列表点击左侧方块打卡；连续天数自动统计，每天从零开始。</p>`;
  } else if(m.type==="progress"){
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="书名 / 目标"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div>
      <div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <div class="frow"><div class="field"><label>起始</label><input id="f-start" type="date" value="${d.startDate||isoToday()}"/></div>
      <div class="field"><label>完成</label><input id="f-end" type="date" value="${d.endDate||''}"/></div></div>
      <div class="field"><label>摘录 / 想法</label><textarea id="f-note" placeholder="随手记">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="finance"){
    fields=`<div class="field"><label>类型</label><div class="seg" id="f-ftype">
        <div class="opt ${d.type!=='income'?'on':''}" data-v="expense">支出</div>
        <div class="opt ${d.type==='income'?'on':''}" data-v="income">收入</div></div></div>
      <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" value="${d.amount??''}" placeholder="0.00" style="font-size:22px;font-weight:800"/></div>
      <div class="field"><label>分类</label><div class="seg" style="flex-wrap:wrap" id="f-cat">${(m.categories||[]).map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto">${esc(c)}</div>`).join("")}</div></div>`;
  } else { // note
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" style="flex-wrap:wrap" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  }

  // 标准卡片样式（记账本精简表单不显示该选项）
  if(m.type!=="finance") fields=`<div class="field"><label>卡片样式</label><div class="seg" id="f-layout"><div class="opt on" data-v="default">标准</div></div></div>`+fields;

  // custom fields (from m.fields config) — rendered after type-specific fields
  (m.fields||[]).forEach(f=>{
    const v=d[f.key]||"";
    if(f.type==="select") fields+=`<div class="field"><label>${esc(f.label)}</label><div class="seg" style="flex-wrap:wrap" id="f-cf-${f.key}">${(f.options||[]).map(o=>`<div class="opt ${o===v?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto">${esc(o)}</div>`).join("")}</div></div>`;
    else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
    else fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
  });
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div>
    <h2>${editing?'编辑':'新建'} · ${m.name}</h2><div class="sub">${m.desc}</div>
    ${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  // segmented pickers
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key, d.id); };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    const tv=val("#f-title"); if(tv!==undefined) d.title=(tv||"").trim()||"未命名";
    d.layout=seg("#f-layout")||d.layout||'default';
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.startDate=val("#f-start")||isoToday(); d.endDate=val("#f-end")||""; d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||d.type||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; if(!d.date) d.date=isoToday(); }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    // save custom fields
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
  };
}

function newItem(m){
  const base={ id: Date.now() };
  let item;
  if(m.type==="todo") item={...base, title:"", priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"), done:false, note:""};
  else if(m.type==="checkin") item={...base, title:"", log:{}};
  else if(m.type==="progress") item={...base, title:"", current:0, target: (m.unit==="页"?100:20), unit:m.unit||"", note:"", startDate:isoToday(), endDate:""};
  else if(m.type==="finance") item={...base, title:"", type:"expense", amount:"", category:(m.categories&&m.categories[0])||"其他", date:isoToday()};
  else item={...base, title:"", content:"", mood:(m.moods&&m.moods[0])||"", date:isoToday()};
  // initialize custom fields
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

/* ---------- delete confirm ---------- */
function confirmDelete(key,id){
  const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>删除记录</h2>
    <div class="sub">确定删除「${esc(item.title||'这条记录')}」？此操作不可撤销。</div>
    <div class="modal-actions"><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); };
}

/* 记账预算设置弹窗 */
function openBudgetModal(){
  const cur=+(data.__budget||0);
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>${icon("wallet",20)} 设置本月预算</h2>
    <div class="sub">预算与支出做差额统计，不依赖收入</div>
    <div class="field"><label>本月预算（¥）</label><input id="b-amt" type="number" value="${cur||''}" placeholder="0"/></div>
    <div class="modal-actions"><button class="btn ghost" id="b-cancel">取消</button><button class="btn" id="b-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#b-cancel").onclick=close;
  overlay.querySelector("#b-save").onclick=()=>{
    data.__budget=Math.max(0,+overlay.querySelector("#b-amt").value||0);
    persist(); toast("预算已保存","success"); close();
  };
}

/* ---------- 设置弹窗 ---------- */
function openSettings(){
  data.__settings = data.__settings || { modules: {} };
  const opts = [
    { key:"1m", label:"1 个月" },
    { key:"6m", label:"6 个月" },
    { key:"12m", label:"12 个月" },
    { key:"forever", label:"永久" },
  ];
  const expiryOf = k => data.__settings.modules[k] || "forever";
  const modRows = CONFIG.modules.map(m=>{
    const cur = expiryOf(m.key);
    return `<div class="field"><label>${m.name}</label><div class="seg" id="s-mod-${m.key}">${opts.map(o=>`<div class="opt ${o.key===cur?'on':''}" data-v="${o.key}">${o.label}</div>`).join("")}</div></div>`;
  }).join("");

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div>
    <h2>${icon("settings",20)} 设置</h2>
    <div class="sub">修改密码 · 数据过期策略</div>
    <div class="field"><label>新密码</label><input id="s-pwd" type="password" placeholder="留空则不修改" value=""/></div>
    <div class="field"><label>确认密码</label><input id="s-pwd2" type="password" placeholder="再次输入"/></div>
    <div style="height:1px;background:var(--border);margin:16px 0 12px"></div>
    <div class="sub" style="margin-bottom:12px">数据保存期限（过期数据自动清除）</div>
    ${modRows}
    <div class="modal-actions">
      <button class="btn ghost" id="s-cancel">取消</button><button class="btn" id="s-save">保存设置</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  overlay.querySelector("#s-cancel").onclick=close;
  overlay.querySelector("#s-save").onclick=()=>{
    const pwd=overlay.querySelector("#s-pwd").value.trim();
    const pwd2=overlay.querySelector("#s-pwd2").value.trim();
    if(pwd){
      if(pwd!==pwd2){ toast("两次密码不一致","danger"); return; }
      if(pwd.length<4){ toast("密码至少4位","danger"); return; }
      data.__pwd = pwd;
    }
    CONFIG.modules.forEach(m=>{
      const sel=overlay.querySelector(`#s-mod-${m.key} .on`);
      data.__settings.modules[m.key] = sel ? sel.dataset.v : "forever";
    });
    store.save(); syncSave();
    toast("设置已保存","success"); close();
  };
}

/* ---------- router / nav ---------- */
function go(v){ view=v; closeDrawer(); render(); window.scrollTo({top:0}); }
function render(){
  // top title
  if(view==="home"){ $("#topTitle").firstChild.textContent="今天也要打起精神来！"; $("#topSub").textContent="TODAY · FIGHTING!"; }
  else if(view==="insight"){ $("#topTitle").firstChild.textContent="汇总统计"; $("#topSub").textContent="各模块进展 · 支出统计"; }
  else { const m=modOf(view); $("#topTitle").firstChild.textContent=m?m.name:"我的工作台"; $("#topSub").textContent=m?m.desc:""; }
  // nav active
  $("#nav").querySelector('[data-nav="home"]').classList.toggle("active", view==="home");
  $("#nav").querySelector('[data-nav="insight"]').classList.toggle("active", view==="insight");
  // render body
  if(view==="home") renderHome();
  else if(view==="insight") renderInsight();
  else renderModule(view);
}

/* ---------- drawer ---------- */
function buildDrawer(){
  $("#drawerName").textContent = data.__owner || CONFIG.owner;
  $("#drawerSlogan").textContent=CONFIG.slogan;
  $("#drawerName").addEventListener("blur", ()=>{
    let v = $("#drawerName").textContent.trim();
    if(!v) v = CONFIG.owner;
    data.__owner = v; store.save();
  });
  $("#drawerName").addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); $("#drawerName").blur(); } });
  const items=[`<div class="ditem" data-go="home">${icon("home",20)}首页</div>`]
    .concat(CONFIG.modules.map(m=>`<div class="ditem" data-go="${m.key}">${icon(m.icon,20)}${m.name}</div>`))
    .concat([`<div class="ditem" data-go="insight">${icon("chart",20)}汇总统计</div>`])
    .concat([`<div class="ditem" id="ditem-settings">${icon("settings",20)}设置</div>`])
    .concat([`<div class="ditem" id="ditem-switch">${icon("pc",20)}切换到桌面版</div>`]);
  $("#drawerList").innerHTML=items.join("");
  $("#drawerList").querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));
  $("#ditem-settings").onclick = ()=>{ closeDrawer(); openSettings(); };
  $("#ditem-switch").onclick = ()=>{ closeDrawer(); goDesktop(); };
}

/* 切到桌面版：记住偏好后跳转 */
function goDesktop(){
  try{ localStorage.setItem("wb_version","desktop"); }catch(e){}
  location.href="workbench-desktop.html";
}
function openDrawer(){
  $("#drawerList").querySelectorAll(".ditem").forEach(el=>el.classList.toggle("active", el.dataset.go===view));
  $("#drawer").classList.add("show"); $("#scrim").classList.add("show");
}
function closeDrawer(){ $("#drawer").classList.remove("show"); $("#scrim").classList.remove("show"); }

/* ---------- wire chrome ---------- */
$("#btn-menu").onclick=openDrawer;
$("#drawerClose").onclick=closeDrawer;
$("#scrim").onclick=closeDrawer;
$("#nav").querySelectorAll(".n").forEach(n=>n.onclick=()=>{
  const t=n.dataset.nav;
  if(t==="drawer") openDrawer();
  else go(t);
});

/* ---------- avatar upload (with compression) ---------- */
$("#brandCam").innerHTML = icon("camera",18);
function applyAvatar(){
  if(data.__avatar){
    $("#brandImg").src = data.__avatar;
    $("#brandImg").style.display = "block";
    $("#brandCam").style.opacity = "";
  } else {
    $("#brandImg").style.display = "none";
    $("#brandCam").style.opacity = "1";
  }
}
applyAvatar();
$("#drawerBrand").onclick = () => $("#avatarInput").click();
$("#avatarInput").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const maxW = 200, maxH = 200;
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxW){ h = h * maxW / w; w = maxW; } }
      else { if(h > maxH){ w = w * maxH / h; h = maxH; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      data.__avatar = canvas.toDataURL("image/jpeg", 0.8);
      applyAvatar();
      try { store.save(); toast("头像已更新","success"); }
      catch(err){ toast("保存失败，图片过大","danger"); }
    };
    img.onerror = () => toast("图片加载失败","danger");
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
  e.target.value = "";
};

/* ---------- export / import backup ---------- */
$("#btn-export").onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const d = new Date();
  a.href = url;
  a.download = `workbench-backup-${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast("备份已导出","success");
};
$("#btn-import").onclick = () => $("#importInput").click();
$("#importInput").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if(typeof parsed !== "object" || parsed === null) throw new Error("invalid");
      data = parsed;
      CONFIG.modules.forEach(m => { if(!data[m.key]) data[m.key] = structuredClone(m.seed||[]); });
      store.save(); syncSave();
      applyAvatar();
      render();
      toast("备份已导入","success");
    } catch(err){ toast("导入失败：文件格式不正确","danger"); }
  };
  reader.readAsText(f);
  e.target.value = "";
};

/* ---------- utils ---------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }

/* ---------- 登录 / 注册弹窗 ---------- */
function openAuthModal(tab){
  const overlay = document.createElement("div"); overlay.className = "overlay";
  overlay.style.alignItems = "center";
  overlay.innerHTML = `<div class="modal auth-modal"><h3>${icon("bolt",20)} 登录数据同步</h3>
    <div class="sub">登录后数据自动同步到云端，多设备无缝切换</div>
    <div class="tab-row" id="auth-tabs">
      <div class="tab ${tab==='login'?'on':''}" data-t="login">登录</div>
      <div class="tab ${tab==='register'?'on':''}" data-t="register">注册</div>
    </div>
    <div class="field"><label>邮箱</label><input id="auth-email" type="email" placeholder="your@email.com" autocomplete="email"/></div>
    <div class="field"><label>密码</label><input id="auth-pwd" type="password" placeholder="至少 6 位" autocomplete="current-password"/></div>
    <div class="modal-actions">
      <button class="link-danger" id="auth-logout" style="display:none">退出登录</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="auth-cancel">取消</button>
      <button class="btn" id="auth-submit">${tab==='register'?'注册':'登录'}</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if(e.target === overlay) close(); };
  overlay.querySelector("#auth-cancel").onclick = close;

  if(supabaseUser){
    overlay.querySelector("#auth-logout").style.display = '';
    overlay.querySelector("#auth-email").value = supabaseUser.email || '';
    overlay.querySelector("#auth-email").disabled = true;
    overlay.querySelector("#auth-pwd").disabled = true;
    overlay.querySelector("#auth-submit").style.display = 'none';
  }

  const tabs = overlay.querySelector("#auth-tabs");
  let mode = tab;
  tabs.querySelectorAll(".tab").forEach(t => t.onclick = () => {
    tabs.querySelectorAll(".tab").forEach(x => x.classList.remove("on")); t.classList.add("on");
    mode = t.dataset.t;
    overlay.querySelector("#auth-submit").textContent = mode === 'register' ? '注册' : '登录';
  });

  overlay.querySelector("#auth-logout").onclick = async () => {
    await supabase.auth.signOut();
    toast("已退出登录","");
    close();
  };

  overlay.querySelector("#auth-submit").onclick = async function handler(){
    if(!supabase){ toast("云服务未连接，请检查网络后刷新重试","danger"); return; }
    const email = overlay.querySelector("#auth-email").value.trim();
    const pwd = overlay.querySelector("#auth-pwd").value;
    if(!email || !pwd){ toast("请填写邮箱和密码","danger"); return; }
    if(pwd.length < 6){ toast("密码至少 6 位","danger"); return; }
    const btn = overlay.querySelector("#auth-submit");
    btn.disabled = true; btn.textContent = '处理中…'; btn.style.opacity = '.6';
    try {
      let result;
      if(mode === 'register'){
        result = await supabase.auth.signUp({ email, password: pwd });
        if(result.error) throw result.error;
        if(result.data.user && !result.data.session){
          toast("注册成功，请查收验证邮件后登录","success"); close(); return;
        }
      } else {
        result = await supabase.auth.signInWithPassword({ email, password: pwd });
        if(result.error) throw result.error;
      }
      if(result.data.session){
        toast("登录成功","success"); close();
      }
    } catch(e){
      const msg = (e.message || e.msg || "操作失败").toLowerCase();
      if(msg.includes('user already registered') || msg.includes('already been registered') || msg.includes('already exists')) toast("该邮箱已注册，请直接登录","danger");
      else if(msg.includes('invalid login') || msg.includes('invalid credentials')) toast("邮箱或密码错误","danger");
      else toast(e.message || e.msg || "操作失败","danger");
      btn.disabled = false; btn.textContent = mode==='register'?'注册':'登录'; btn.style.opacity = '';
    }
  };
}

function renderAuthState(){
  const bar = $('#authBar');
  const btn = $('#btn-login');
  if(supabaseUser){
    if(bar){ bar.style.display = 'flex'; bar.onclick = () => openAuthModal('login'); }
    if(btn){ btn.style.display = 'none'; }
    const av = $('#authAvatar');
    const ae = $('#authEmail');
    if(av){ av.textContent = (supabaseUser.email||'?')[0].toUpperCase(); }
    if(ae){ ae.textContent = supabaseUser.email || ''; }
  } else {
    if(bar){ bar.style.display = 'none'; }
    if(btn){ btn.style.display = ''; btn.onclick = () => openAuthModal('login'); }
  }
}

async function startAuth(){
  try {
  // 监听登录状态变化
  supabase.auth.onAuthStateChange(async (event, session) => {
    supabaseSession = session;
    supabaseUser = session ? session.user : null;
    renderAuthState();

    if(supabaseUser){
      // 登录后从云端拉数据
      const cloud = await syncLoad();
      if(cloud && typeof cloud === 'object'){
        data = cloud;
        CONFIG.modules.forEach(m => { if(!data[m.key]) data[m.key] = structuredClone(m.seed||[]); });
        store.save();
        applyAvatar();
      } else {
        // 首次登录，把本地数据推到云端
        await syncSave();
      }
      subscribeRealtime();
      startSyncPolling();
      render();
    } else {
      if(realtimeChannel){ supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
      data = store.load();
      applyAvatar();
      render();
    }
  });

  // 检查是否已有会话（记住登录）
  const { data: { session } } = await supabase.auth.getSession();
  if(session){
    supabaseSession = session;
    supabaseUser = session.user;
    renderAuthState();
    const cloud = await syncLoad();
    if(cloud && typeof cloud === 'object'){
      data = cloud;
      CONFIG.modules.forEach(m => { if(!data[m.key]) data[m.key] = structuredClone(m.seed||[]); });
      store.save();
      applyAvatar();
    } else {
      await syncSave();
    }
    subscribeRealtime();
    startSyncPolling();
    render();
  } else {
    renderAuthState();
  }
  } catch(e){ renderAuthState(); console.warn('Auth init failed:', e.message || e); }
}

startAuth();
buildDrawer();
render();
</script>
